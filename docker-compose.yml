services:

  mongo:
    image: mongo:7
    container_name: mongo

    ports:
      - "27017:27017"

    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password

    volumes:
      - mongo-data:/data/db

  mongo-express:
    image: mongo-express

    ports:
      - "8081:8081"

    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: password
      ME_CONFIG_MONGODB_SERVER: mongo

    depends_on:
      - mongo

  backend:
    build: ./backend

    ports:
      - "5000:5000"

    depends_on:
      - mongo

  frontend:
    build: ./frontend

    ports:
      - "80:80"

    depends_on:
      - backend

volumes:
  mongo-data: